<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scott's Doing What? — Coming Soon</title>
<meta name="description" content="Something good is coming soon at ScottsDoingWhat.com">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:#faf6f2;color:#263431}
.hero{min-height:100vh;display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.15fr);overflow:hidden}
.photo{position:relative;min-height:100vh;background:#d9dfcf url('scott.jpg') center 30%/cover no-repeat}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 72%,#faf6f2)}
.content{display:flex;align-items:center;justify-content:center;padding:64px 8vw 64px 5vw;position:relative}
.content:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:#f4d8c8;filter:blur(70px);opacity:.48;right:-90px;bottom:-80px}
.inner{max-width:650px;position:relative;z-index:1}
.eyebrow{margin:0 0 18px;color:#6a8f6f;font-size:clamp(14px,1.5vw,21px);font-weight:700;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(54px,7vw,100px);line-height:.92;margin:0 0 28px;letter-spacing:-.055em;color:#263431}
h1 span{color:#d87c63}
p{font-size:clamp(20px,2vw,29px);line-height:1.45;margin:0;color:#33413e}
.bar{height:17px;background:#e6e6e6;border-radius:999px;margin-top:40px;overflow:hidden;max-width:500px}.bar span{display:block;width:44%;height:100%;border-radius:inherit;background:#d87c63}
.domain{margin-top:24px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#789079}
@media(max-width:780px){.hero{grid-template-columns:1fr}.photo{min-height:52vh;background-position:center 25%}.photo:after{background:linear-gradient(180deg,transparent 72%,#faf6f2)}.content{padding:42px 26px 60px;text-align:center}.inner{margin:auto}.bar{margin:32px auto 0}h1{font-size:clamp(52px,15vw,76px)}}
</style>
</head>
<body>
<main class="hero">
<section class="photo" aria-label="Photo of Scott"></section>
<section class="content"><div class="inner">
<p class="eyebrow">Something good is</p>
<h1>COMING <span>SOON</span></h1>
<p>I’m working on something new.<br>Check back soon!</p>
<div class="bar" aria-hidden="true"><span></span></div>
<div class="domain">scottsdoingwhat.com</div>
</div></section>
</main>
</body>
</html>
